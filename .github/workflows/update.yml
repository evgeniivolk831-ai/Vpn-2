name: Update GlobalPulse subscription

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned official Xray
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/xtls/xray-core:26.9.30@sha256:1f3cc7e79d34870624c7fa23c125739d3a40a93e57abe0946ee2077b08adfc67"
          docker pull "$IMAGE"
          CID="$(docker create "$IMAGE")"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$CID:/usr/local/bin/xray" ./xray
          chmod 755 ./xray
          ./xray version

      - name: Build and E2E verify subscription
        env:
          XRAY_BIN: ./xray
          E2E_MAX_CANDIDATES: "80"
          E2E_TIMEOUT: "7"
        run: python scripts/aggregate.py

      - name: Commit generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh E2E-verified subscription"
            git push
          fi
